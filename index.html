<meta name="theme-color" content="#0d0c0a">
<style>
  :root{color-scheme:dark;--ink:#0d0c0a;--panel:#17150f;--line:#342f22;--gold:#cfa543;--gold-hi:#e8c874;--text:#efe9dc;--muted:#a39a87;--bad:#e07a7a}
  *{box-sizing:border-box}
  html,body{background:var(--ink);margin:0;height:100%}
  body{color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px 16px}
  .box{width:100%;max-width:320px;display:grid;justify-items:center;gap:14px;text-align:center}
  .box img{width:74px;height:auto}
  h1{margin:0;font:700 22px Georgia,serif;letter-spacing:.14em;color:var(--gold-hi)}
  p{margin:0;color:var(--muted);font-size:14px}
  .dots{display:flex;gap:12px;min-height:18px;justify-content:center;flex-wrap:wrap}
  .dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold);display:block}
  .dots i.on{background:var(--gold)}
  .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
  .pad button{height:72px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--text);font:500 26px system-ui,sans-serif;cursor:pointer}
  .pad button:active{background:var(--gold);color:#16130c}
  .pad .fn{font-size:14px;color:var(--muted);border-color:transparent;background:transparent}
  .pad button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
  .msg{min-height:22px;font-size:14px;color:var(--bad)}
  .msg.wait{color:var(--muted)}
  .shake{animation:sh .35s}
  @keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let pin = "", busy = false;
const dots = document.getElementById("dots"), msg = document.getElementById("msg");
function draw(){ dots.innerHTML = Array.from({length: Math.max(pin.length, 4)}, (_, i) => `<i class="${i < pin.length ? "on" : ""}"></i>`).join(""); }
async function keyFrom(p){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:b(SALT), iterations:ITER, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, true, ["decrypt"]);
}
async function open_(key){
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b(IV) }, key, b(CT));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function tryPin(){
  if (busy || !pin) return; busy = true; msg.className = "msg wait"; msg.textContent = "Checking…";
  try {
    const key = await keyFrom(pin);
    const html = await open_(key);
    try { sessionStorage.setItem("sops_key", JSON.stringify(await crypto.subtle.exportKey("jwk", key))); } catch (e) {}
    show(html);
  } catch (e) {
    msg.className = "msg"; msg.textContent = "Wrong PIN"; pin = ""; draw();
    dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake");
  } finally { busy = false; }
}
document.getElementById("pad").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.k === "clear") { pin = ""; msg.textContent = ""; }
  else if (t.dataset.k === "ok") { tryPin(); return; }
  else if (pin.length < 12) pin += t.textContent;
  draw();
});
document.addEventListener("keydown", e => {
  if (/^\d$/.test(e.key) && pin.length < 12) { pin += e.key; draw(); }
  else if (e.key === "Backspace") { pin = pin.slice(0, -1); draw(); }
  else if (e.key === "Enter") tryPin();
});
draw();
(async () => {
  if (!crypto || !crypto.subtle) { msg.textContent = "Open this page over https in Chrome or Safari."; return; }
  let jwk = null; try { jwk = JSON.parse(sessionStorage.getItem("sops_key") || "null"); } catch (e) {}
  if (!jwk) return;
  try { const key = await crypto.subtle.importKey("jwk", jwk, { name:"AES-GCM" }, false, ["decrypt"]); show(await open_(key)); }
  catch (e) { try { sessionStorage.removeItem("sops_key"); } catch (_) {} }
})();
